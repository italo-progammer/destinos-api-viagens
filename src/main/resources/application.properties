spring.application.name=destinos-api-viagens
server.port=8080

# ---------------------------------------------------------------------------
# Banco de dados (PostgreSQL)
# Os valores podem ser sobrescritos por variaveis de ambiente, sem alterar o
# codigo. Os padroes abaixo funcionam com o docker-compose.yml do projeto.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/destinos_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update: cria/ajusta as tabelas a partir das entidades (pratico para
# desenvolvimento). Em producao o ideal e "validate" + migracoes (Flyway).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
# Evita manter a sessao do banco aberta durante a serializacao da resposta
spring.jpa.open-in-view=false
# Mude para true para ver no console o SQL gerado pelo Hibernate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Formatacao mais legivel do JSON de resposta durante o desenvolvimento
spring.jackson.serialization.indent-output=true

# ---------------------------------------------------------------------------
# Usuarios de exemplo criados na primeira execucao (DataInitializer).
# ATENCAO: senhas padrao servem apenas para desenvolvimento/avaliacao.
# Em qualquer outro ambiente, defina SEED_ADMIN_PASSWORD e SEED_USER_PASSWORD
# ou desative com APP_SEED_ENABLED=false.
# As senhas sao gravadas no banco criptografadas com BCrypt.
# ---------------------------------------------------------------------------
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin.username=admin
app.seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.user.username=usuario
app.seed.user.password=${SEED_USER_PASSWORD:user123}
