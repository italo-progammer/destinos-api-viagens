# Perfil "test": usado pelos testes automatizados (@ActiveProfiles("test")).
# Sobrescreve apenas o que muda em relacao ao application.properties principal:
# em vez do PostgreSQL, usa um H2 em memoria (com nome unico por contexto do
# Spring, para que os testes nao interfiram entre si), para que "mvn test" rode em
# qualquer maquina sem depender de banco instalado.
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jackson.serialization.indent-output=false

# Usuarios usados pelos testes (mesmos valores do README)
app.seed.enabled=true
app.seed.admin.username=admin
app.seed.admin.password=admin123
app.seed.user.username=usuario
app.seed.user.password=user123
