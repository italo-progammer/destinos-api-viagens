# Sobe um PostgreSQL local ja com o banco "destinos_db" criado.
# Uso:  docker compose up -d
# Os valores abaixo coincidem com os padroes de src/main/resources/application.properties.
services:
  postgres:
    image: postgres:16-alpine
    container_name: destinos-postgres
    environment:
      POSTGRES_DB: destinos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - destinos_pgdata:/var/lib/postgresql/data

volumes:
  destinos_pgdata:
